[server]
# Re-run the app automatically when app.py is saved, so local UI iteration
# doesn't need a manual browser refresh.
runOnSave = true

[theme]
# Minimalist / technical: neutral grayscale ground, near-black text, black
# accent -- must match styles.css --tw-bg / --tw-panel-2 so Streamlit's own
# baked theme (painted on the app shell and inside every component iframe's
# default document background) doesn't flash a different tone at the seams.
# Colour is used ONLY on tags / third-party tool logos -- never on chrome.
base = "light"
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#DBDBDB"
textColor = "#1A1A1A"
font = "sans serif"
