<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"
     aria-label="A tree of workflow nodes, in the app's own node shapes, assembling from real-world data sources — a car, a factory, a live sensor feed — into the testware.dev digital twin">
<style>
  text { font-family: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* -- palette: the same tokens the real workflow canvas uses, light mode
     only, deliberately -- this is a static image with no way to see the
     app's own light/dark toggle (that's in-app state, not OS state), so it
     used to instead follow the *viewer's* OS colour-scheme preference via
     @media (prefers-color-scheme: dark). That let it drift out of sync with
     the app around it (light app, dark image, on the same page, whenever a
     viewer's OS happened to prefer dark). Fixed light colours keep it
     predictable everywhere instead. */
  .card   { fill: rgba(255,255,255,0.92); stroke: rgba(26,26,26,0.4); filter: url(#nodeShadow); }
  .skel   { fill: rgba(26,26,26,0.26); }
  .dot    { fill: #FFFFFF; stroke: #454542; }
  .wire   { stroke: rgba(17,17,17,0.5); }
  .pulse  { fill: rgba(17,17,17,0.88); }
  .icon   { fill: #1A1A1A; stroke: #1A1A1A; }
  .ring   { stroke: #2F6BFF; }
  .mark   { stroke: #1A1A1A; }

  /* -- assembly: fade/scale in, left to right -------------------------------- */
  @keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw  { to { stroke-dashoffset: 0; } }
  @keyframes settle{ 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes ringPulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.045); } }
  @keyframes flow  { from { offset-distance: 0%; opacity: 0; } 8%,92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }

  .node { transform-box: fill-box; transform-origin: center; opacity: 0; animation: popIn .45s cubic-bezier(.2,.7,.2,1) both; }
  .n-icon1 { animation-delay: .05s }
  .n-icon2 { animation-delay: .18s }
  .n-icon3 { animation-delay: .31s }
  .n-mid1  { animation-delay: .95s }
  .n-mid2  { animation-delay: 1.10s }
  .n-mid3  { animation-delay: 1.25s }
  .n-root  { animation: settle .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: 1.85s; }

  .path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .35s ease-out both; }
  .w1 { animation-delay: .35s } .w2 { animation-delay: .45s }
  .w3 { animation-delay: .55s } .w4 { animation-delay: .65s }
  .w5 { animation-delay: .75s }
  .w6 { animation-delay: 1.35s } .w7 { animation-delay: 1.48s } .w8 { animation-delay: 1.61s }

  .ring { fill: none; stroke-width: 2.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .n-root .ring { animation: ringPulse 2.6s ease-in-out 2.5s infinite; }

  .flow { offset-rotate: 0deg; opacity: 0; animation: flow 2.6s linear infinite; }
  /* left -> middle: data climbing in from the real-world sources */
  .f4 { offset-path: path("M116,80  C195,80  195,70  275,70");  animation-delay: 1.5s; }
  .f5 { offset-path: path("M116,180 C195,180 195,90  275,90");  animation-delay: 2.0s; }
  .f6 { offset-path: path("M116,180 C195,180 195,170 275,170"); animation-delay: 1.8s; }
  .f7 { offset-path: path("M116,280 C195,280 195,190 275,190"); animation-delay: 2.3s; }
  .f8 { offset-path: path("M116,280 C195,280 195,280 275,280"); animation-delay: 1.6s; }
  /* middle -> right: data converging into the twin */
  .f1 { offset-path: path("M385,80  C450,80  450,160 495,160"); animation-delay: 2.6s; }
  .f2 { offset-path: path("M385,180 C450,180 450,180 495,180"); animation-delay: 3.5s; }
  .f3 { offset-path: path("M385,280 C450,280 450,200 495,200"); animation-delay: 4.4s; }

  @media (prefers-reduced-motion: reduce) {
    .node, .path, .ring, .flow { animation: none !important; }
    .node { opacity: 1 !important; transform: none !important; }
    .path { stroke-dashoffset: 0 !important; }
    .ring { opacity: .7 !important; }
    .flow { display: none; }
  }
</style>

<defs>
  <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000" flood-opacity="0.16"/>
  </filter>
</defs>

<!-- wires: data flowing right, from the real world into the models, then into the twin -->
<path class="path wire w1" d="M116,80  C195,80  195,70  275,70"  pathLength="1"/>
<path class="path wire w2" d="M116,180 C195,180 195,90  275,90"  pathLength="1"/>
<path class="path wire w3" d="M116,180 C195,180 195,170 275,170" pathLength="1"/>
<path class="path wire w4" d="M116,280 C195,280 195,190 275,190" pathLength="1"/>
<path class="path wire w5" d="M116,280 C195,280 195,280 275,280" pathLength="1"/>
<path class="path wire w6" d="M385,80  C450,80  450,160 495,160" pathLength="1"/>
<path class="path wire w7" d="M385,180 C450,180 450,180 495,180" pathLength="1"/>
<path class="path wire w8" d="M385,280 C450,280 450,200 495,200" pathLength="1"/>

<!-- little pulses of live data flowing along every wire, once things have
     settled: first left -> middle as the sources feed the models, then
     middle -> right as the models converge into the twin. Same neutral ink
     as the wires themselves, just more opaque, matching the real canvas's
     own connection colour rather than inventing a new one -->
<circle class="flow pulse f4" r="3.5"/>
<circle class="flow pulse f5" r="3.5"/>
<circle class="flow pulse f6" r="3.5"/>
<circle class="flow pulse f7" r="3.5"/>
<circle class="flow pulse f8" r="3.5"/>
<circle class="flow pulse f1" r="3.5"/>
<circle class="flow pulse f2" r="3.5"/>
<circle class="flow pulse f3" r="3.5"/>

<!-- LEFT: the real objects the models pull data from -->
<g class="node n-icon1">
  <rect class="card" x="40" y="57" width="76" height="46" rx="23" stroke-width="1.3"/>
  <circle class="dot" cx="116" cy="80" r="3.6" stroke-width="1.3"/>
  <g transform="translate(78,80) scale(0.82) translate(-12,-12)">
    <path class="icon" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
          d="M5,11 L6.5,6.5 C6.7,5.9 7.3,5.5 8,5.5 H16 C16.7,5.5 17.3,5.9 17.5,6.5 L19,11
             M3,11 H21 A1,1 0 0 1 22,12 V16 A1,1 0 0 1 21,17 H19
             A2,2 0 0 1 15,17 H9 A2,2 0 0 1 5,17 H3 A1,1 0 0 1 2,16 V12 A1,1 0 0 1 3,11 Z"/>
  </g>
</g>

<g class="node n-icon2">
  <rect class="card" x="40" y="157" width="76" height="46" rx="23" stroke-width="1.3"/>
  <circle class="dot" cx="116" cy="180" r="3.6" stroke-width="1.3"/>
  <g transform="translate(78,180) scale(0.82) translate(-12,-12)">
    <path class="icon" fill="currentColor" stroke="none"
          d="M2 21V10l6 4V10l6 4V7l7 4v10H2z"/>
  </g>
</g>

<g class="node n-icon3">
  <rect class="card" x="40" y="257" width="76" height="46" rx="23" stroke-width="1.3"/>
  <circle class="dot" cx="116" cy="280" r="3.6" stroke-width="1.3"/>
  <g transform="translate(78,280)">
    <polyline class="icon" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
              points="-12,0 -6,0 -2,-9 3,10 7,0 12,0"/>
  </g>
</g>

<!-- MIDDLE: three of the app's own node shapes: process (sharp box), database
     (cylinder), output (footed card), each fed by the real-world sources above -->
<g class="node n-mid1">
  <rect class="card" x="275" y="38" width="110" height="64" rx="2" stroke-width="1.3"/>
  <circle class="dot" cx="275" cy="70" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="275" cy="90" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="385" cy="80" r="3.6" stroke-width="1.3"/>
  <rect class="skel" x="291" y="57" width="46" height="6" rx="3"/>
  <rect class="skel" x="291" y="71" width="30" height="6" rx="3"/>
  <rect class="skel" x="291" y="85" width="60" height="6" rx="3"/>
</g>

<g class="node n-mid2">
  <rect class="card" x="275" y="148" width="110" height="64" rx="55" ry="20" stroke-width="1.3"/>
  <circle class="dot" cx="275" cy="170" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="275" cy="190" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="385" cy="180" r="3.6" stroke-width="1.3"/>
  <rect class="skel" x="291" y="171" width="46" height="6" rx="3"/>
  <rect class="skel" x="291" y="185" width="30" height="6" rx="3"/>
</g>

<g class="node n-mid3">
  <path class="card" stroke-width="1.3"
        d="M278,258 H382 A3,3 0 0 1 385,261 V294 A18,18 0 0 1 367,312 H293
           A18,18 0 0 1 275,294 V261 A3,3 0 0 1 278,258 Z"/>
  <circle class="dot" cx="275" cy="280" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="385" cy="280" r="3.6" stroke-width="1.3"/>
  <rect class="skel" x="291" y="277" width="46" height="6" rx="3"/>
  <rect class="skel" x="291" y="291" width="30" height="6" rx="3"/>
</g>

<!-- RIGHT: the twin they converge into -->
<g class="node n-root">
  <rect class="ring" x="482" y="127" width="156" height="106" rx="22"/>
  <rect class="card" x="495" y="138" width="130" height="84" rx="18" stroke-width="1.5"/>
  <circle class="dot" cx="495" cy="160" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="495" cy="180" r="3.6" stroke-width="1.3"/>
  <circle class="dot" cx="495" cy="200" r="3.6" stroke-width="1.3"/>
  <path class="mark" fill="none" stroke-width="2.6" stroke-linejoin="miter" stroke-linecap="square"
        d="M580,172.5 V160 H540 V200 H580 V187.5"/>
</g>
</svg>
