<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
<style>
  /* -------------------------------------------------------------------------
     testware.dev — in-app presentation deck (the Dashboard section).
     Renders presentation.md as a one-slide-at-a-time, scroll-snapped
     sequence -- this iframe owns its own bounded, internally-scrolling
     viewport (sized to ~the outer page's visible height, see setViewportHeight()
     below), independent of the rest of the (plain-scrolling) page. One
     colour world: the app's own neutral grayscale / near-black palette and
     typeface (Source Sans 3), with a little presentation flourish -- a
     faint connecting-node network and staged slide entrances. Edit slides
     in presentation.md, not here.
     ---------------------------------------------------------------------- */
  /* NOTE: hand-copied from styles.css's --tw-* tokens (and
     components/workflow/index.html's --wf-* tokens) under yet another naming
     convention -- no single source of truth across the three files, so a
     palette change here must be mirrored in both of them by hand. */
  /* White stage (--bg) AND white slide cards (--panel) -- the cards are told
     apart by a firm grey boundary (--hair, drawn 2px on .frame) rather than a
     fill difference, so a projector that crushes near-whites together still
     shows each slide clearly. */
  :root {
    --bg: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --panel: #FFFFFF;
    --panel-2: #ECECEC;
    --ink: #1A1A1A;
    --muted: #6B6B6B;
    --hair: #A8A8A8;
    /* faint separator / connector lines inside the sample pictograms --
       near-white in dark mode so they read on the dark card */
    --line: #C4C4C4;
    --mock: #4A4A4A;   /* app-mock contour: thin dark grey (light in dark mode) */
    --accent: #111111;
    --font: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  /* app.py passes theme= into deck_view(); applyTheme() (see script below)
     stamps this attribute on load and on every theme-only rerun. */
  :root[data-theme="dark"] {
    --bg: #141414;
    --bg-elevated: #1E1E1E;
    --panel: #1E1E1E;
    --panel-2: #303030;
    --ink: #F2F2F2;
    --muted: #9C9C9C;
    --hair: #555555;
    --line: #CFCFCF;   /* near-white separator lines on the dark sample cards */
    --mock: #C7C7C7;
    --accent: #F2F2F2;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  #net { position: fixed; inset: 0; z-index: 0; display: block; pointer-events: none; }

  /* The ONE scrolling element in this document -- deliberately not `body`
     (avoids the standards-mode html-vs-body "scrollingElement" ambiguity).
     Mandatory scroll-snap: the deck always rests exactly on a slide, never
     floating half-between two so the seam/space shows during a
     presentation. Each wheel/track gesture pages one whole slide
     (scroll-snap-stop:always on .slide). Handing back to the outer page at
     the very top / bottom still works -- the wheel handler below intercepts
     those before the snap container sees them. */
  #scroller {
    position: relative;
    z-index: 1;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: y mandatory;
  }

  /* Each slide is AT LEAST this iframe's own (bounded) viewport tall
     (min-height, not a fixed height) so a slide with more content than
     fits in one screen -- a tall image, a long list -- grows instead of
     clipping (a taller-than-viewport slide is still freely scrollable
     inside its own snap area). scroll-snap-align pins each slide's top to
     the scroller top; scroll-snap-stop:always keeps one gesture from
     skipping a slide. */
  /* The slide box itself never animates (no opacity/transform on it) -- only
     its content items do, via playEntrance() in the script. Animating the box
     as well used to compound with the scroll-snap correction and read as a
     rough snap at the end of every transition. */
  .slide {
    min-height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: grid;
    /* `safe`: centre the frame while it fits, but as soon as the content is
       taller than the slide, align it to the TOP instead of clipping the
       headline off the top edge (the overflow is then scrollable within the
       slide's own snap area). */
    place-items: safe center;
    padding: clamp(2.5rem, 6vw, 4rem) clamp(1.5rem, 5vw, 4rem) clamp(2rem, 4vw, 3rem);
  }

  /* Sized for a projector: the frame takes most of the screen width and the
     type scale below is deliberately large so text/illustrations read from
     the back of a room. */
  .frame { width: min(1360px, 94vw); }
  .slide[data-layout="content"] .frame,
  .slide[data-layout="media"] .frame,
  .slide[data-layout="mediawide"] .frame,
  .slide[data-layout="split"] .frame,
  .slide[data-layout="quote"] .frame {
    background: var(--panel);
    border: 2px solid var(--hair);
    border-radius: 20px;
    padding: clamp(2rem, 4.5vw, 3.75rem);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .08), 0 24px 60px rgba(0, 0, 0, .13);
  }
  .slide[data-layout="title"] .frame,
  .slide[data-layout="section"] .frame,
  .slide[data-layout="quote"] .frame { text-align: center; }
  .slide[data-layout="media"] .frame,
  .slide[data-layout="mediawide"] .frame,
  .slide[data-layout="split"] .frame {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1.25rem, 3vw, 2.5rem);
    align-items: center;
  }
  /* text left (narrower), pictogram right (wider) */
  .slide[data-layout="mediawide"] .frame { grid-template-columns: 5fr 7fr; }
  @media (max-width: 760px) {
    .slide[data-layout="media"] .frame,
    .slide[data-layout="mediawide"] .frame,
    .slide[data-layout="split"] .frame { grid-template-columns: 1fr; }
  }
  .col-b { min-width: 0; }

  .kicker {
    font-size: clamp(.9rem, 1.5vw, 1.15rem);
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.15rem;
  }
  .headline {
    font-weight: 700;
    font-size: clamp(2.6rem, 5.4vw, 4.4rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-wrap: balance;
    max-width: 22ch;
  }
  .slide[data-layout="title"] .headline { font-size: clamp(3rem, 6.6vw, 5rem); margin-inline: auto; }
  .slide[data-layout="section"] .headline { font-size: clamp(3rem, 6.8vw, 5.2rem); max-width: 18ch; margin-inline: auto; }
  .headline i, .headline em { font-style: normal; color: var(--accent); }
  .subhead {
    font-size: clamp(1.35rem, 2.3vw, 1.8rem);
    line-height: 1.5;
    color: var(--muted);
    max-width: 48ch;
    margin-top: 1.15rem;
  }
  .slide[data-layout="title"] .subhead,
  .slide[data-layout="section"] .subhead { margin-inline: auto; }
  .body {
    font-size: clamp(1.3rem, 2vw, 1.7rem);
    line-height: 1.55;
    max-width: 56ch;
    margin-top: 1.15rem;
    color: var(--ink);
  }
  .body strong { font-weight: 700; }
  .body a, .list a, .subhead a { color: var(--accent); text-underline-offset: 2px; }

  .list {
    list-style: none;
    margin-top: 1.7rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 56ch;
  }
  .list li {
    position: relative;
    padding-left: 1.7rem;
    font-size: clamp(1.3rem, 2.1vw, 1.75rem);
    line-height: 1.4;
  }
  .list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .55em;
    width: .6rem;
    height: .6rem;
    border-radius: 50%;
    background: var(--accent);
  }
  .list li strong { font-weight: 700; }

  .quote {
    font-size: clamp(1.9rem, 3.4vw, 2.9rem);
    line-height: 1.35;
    letter-spacing: -0.01em;
    max-width: 24ch;
    margin-inline: auto;
  }
  .quote + .body { margin-top: 1.25rem; color: var(--muted); }

  figure.media { margin: 0; }
  figure.media img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 56vh;   /* big, but leaves room for the headline above it on one screen */
    border-radius: 14px;
    border: 1px solid var(--hair);
    background: var(--bg);   /* blend with the slide -- no distinct grey panel */
  }
  /* On the title slide the hero image stands in for the card the other
     layouts have, so it carries the same 2px contour, radius and shadow. */
  .slide[data-layout="title"] figure.media img {
    border-width: 2px;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .08), 0 24px 60px rgba(0, 0, 0, .13);
  }
  figure.media figcaption {
    margin-top: .75rem;
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    line-height: 1.4;
    color: var(--muted);
  }

  /* Staged entrance -- every content item starts hidden here. playEntrance()
     in the script staggers them in (Web Animations API) every time a slide
     becomes the current one, so the animation is identical on every visit to
     every slide EXCEPT the first (shown instantly). --i, set per item in
     build(), is the stagger order. */
  [data-anim] { opacity: 0; transform: translateY(14px); }

  /* Context-1 industry-bubble cluster. Monochrome: each bubble is told apart
     by its contour, no fills or colour (projector legibility). Bubbles are
     absolutely placed (inline % from the BUBBLES table) as a loose cluster;
     each pops in on the slide entrance (BUBBLE_POP in the script). The
     `.bubble` transform below deliberately follows [data-anim] so its
     centring translate wins the source-order tie. */
  .bubbles {
    position: relative;
    width: 100%;
    max-width: min(100%, 70vh);
    aspect-ratio: 1.18 / 1;
    margin-inline: auto;
  }
  .bubble {
    position: absolute;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    /* same soft lift as the search bar */
    box-shadow: 0 2px 5px rgba(0, 0, 0, .14), 0 10px 24px rgba(0, 0, 0, .16);
  }
  .bubble svg {
    width: 56%;
    height: 56%;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  /* Context-1 centrepiece: a big blue-highlighted car */
  .bubble-hero {
    border-color: #2F6BFF;
    border-width: 3px;
    color: #2F6BFF;
    z-index: 2;
    box-shadow: 0 3px 10px rgba(47, 107, 255, .20), 0 14px 32px rgba(47, 107, 255, .16);
  }
  .bubble-hero svg { width: 58%; height: 58%; stroke-width: 1.6; }

  /* Context-3 split real-car / digital-twin pictogram (its own colours are
     inside the inline <svg>). Framed like the other media images. */
  .cartwin { margin: 0; display: grid; place-items: center; }
  .cartwin svg,
  .lifecycle svg {
    display: block;
    width: 100%;
    max-height: 54vh;
    border-radius: 14px;
    border: 1px solid var(--line);
    /* the card surface, not the page ground -- so in dark mode the pictogram
       area isn't near-black-on-near-black and the shapes actually read */
    background: var(--panel);
  }
  .cartwin svg { max-height: 66vh; }   /* Context-3: run the pictogram larger */
  .lifecycle.expert5 svg { max-height: 68vh; }   /* Challenge-5: larger */
  /* Context-4 R&D -> V&V -> Prod timeline (monochrome, contour only). */
  .lifecycle { margin: 0; display: grid; place-items: center; }
  /* Context-2: the pictogram is wider than its column so the incoming car
     overhangs the card's right border (extra space between it and the dev). */
  .c2fig { margin: 0; }
  .c2fig svg { display: block; width: calc(100% + 5rem); max-height: 58vh; }
  /* Context-8 app mock -- larger, borderless, thin dark-grey lines. */
  .appmock { margin: 0; display: grid; place-items: center; }
  .appmock svg { display: block; width: 100%; max-height: 72vh; }

  /* ---- chrome: the deck's own dot-nav is retired -- the page now has a
     single left-edge rail (app | slide | ... | examples) rendered by the
     PARENT (styles.css #tw-navrail + app.py render_nav_rail), which drives
     this deck through window.__deckAPI below. Kept in the DOM but hidden so
     renderChrome()/updateChrome() stay harmless no-ops. */
  #topbar {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 3;
    justify-content: center;
    padding: clamp(1rem, 3vw, 1.5rem) 1rem;
    transition: opacity .35s var(--ease);
  }
  body.idle #topbar { opacity: .35; }
  .dots { display: flex; gap: .34rem; }
  .dot {
    width: 1.35rem;
    height: 2px;
    background: var(--hair);
    cursor: pointer;
    transition: background .25s var(--ease);
  }
  .dot.on { background: var(--accent); }
  .dot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .empty {
    height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    padding: 2rem;
    font-size: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
    [data-anim] { opacity: 1 !important; transform: none !important; }
    .slide { transform: none !important; }
    #scroller { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <canvas id="net" aria-hidden="true"></canvas>

  <div id="topbar">
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <div id="scroller">
    <div id="deck"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ---- raw Streamlit component protocol (mirrors components/workflow) ---- */
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var scroller = document.getElementById("scroller");
  var deck = document.getElementById("deck");
  var dotsWrap = document.getElementById("dots");

  var slides = [];
  var idx = 0;
  var lastMd = null;
  var HEADER_OFFSET = 80;   // clears the outer page's sticky header (styles.css)
  var FALLBACK_HEIGHT = 800;
  // Set by the outer-page scroll-handoff IIFE below; lets the keyboard
  // handler carry ArrowDown past the last slide into Examples (and ArrowUp
  // past the first slide back to the app area).
  var outerNav = null;

  /* ---- tiny markdown -> slides (unchanged from the original parser) ---- */
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function inl(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\b_([^_]+)_\b/g, "<em>$1</em>");
    s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  function parse(src) {
    var parts = String(src || "").replace(/\r\n?/g, "\n").split(/\n[ \t]*(?:-{3,}|\*{3,})[ \t]*\n/);
    var out = [];
    parts.forEach(function (chunk, si) {
      var lines = chunk.split("\n");
      var blocks = [], forced = null, i = 0;
      while (i < lines.length) {
        var t = lines[i].trim();
        if (!t) { i++; continue; }
        var m;
        if ((m = t.match(/^<!--\s*layout:\s*([a-z]+)\s*-->$/i))) { forced = m[1].toLowerCase(); i++; continue; }
        if (/^<!--/.test(t)) { while (i < lines.length && !/-->/.test(lines[i])) i++; i++; continue; }
        if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
          var lvl = m[1].length;
          blocks.push({ t: lvl >= 4 ? "kicker" : lvl === 3 ? "subhead" : "headline", h: inl(m[2]) });
          i++; continue;
        }
        if ((m = t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/))) { blocks.push({ t: "media", src: m[2], cap: m[1] }); i++; continue; }
        if (/^>\s?/.test(t)) {
          var q = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
          blocks.push({ t: "quote", h: inl(q.join(" ")) });
          continue;
        }
        if (/^[-*+]\s+/.test(t)) {
          var items = [];
          while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) { items.push(inl(lines[i].trim().replace(/^[-*+]\s+/, ""))); i++; }
          blocks.push({ t: "list", items: items });
          continue;
        }
        var para = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>\s?|[-*+]\s|!\[|<!--)/.test(lines[i].trim())) {
          para.push(lines[i].trim()); i++;
        }
        blocks.push({ t: "p", h: inl(para.join(" ")) });
      }
      if (!blocks.length) return;
      out.push({ layout: forced || infer(blocks, si), blocks: blocks });
    });
    return out;
  }

  function infer(blocks, si) {
    var k = blocks.map(function (b) { return b.t; });
    var has = function (x) { return k.indexOf(x) !== -1; };
    if (si === 0) return "title";
    if (has("media") && !has("list")) return "media";
    if (has("quote") && !has("list")) return "quote";
    if (!has("list") && !has("p") && !has("media") && !has("quote") && !has("subhead")) return "section";
    return "content";
  }

  // ---- Context-1 industry-bubble cluster ----------------------------------
  // Monochrome line pictograms (stroke = currentColor, no fills / colour) so
  // they read on a projector; the bubbles are told apart by their contour.
  var IND_ICONS = {
    automotive:      "<path d='M3 14l2-6h14l2 6'/><rect x='3' y='14' width='18' height='4' rx='1'/><circle cx='7.5' cy='18.5' r='1.4'/><circle cx='16.5' cy='18.5' r='1.4'/>",
    aerospace:       "<path d='M12 3c3 2.5 4 6.5 4 10l-4 3-4-3c0-3.5 1-7.5 4-10z'/><path d='M8 14l-2.5 4 3.2-1M16 14l2.5 4-3.2-1'/><circle cx='12' cy='9.5' r='1.3'/>",
    renewables:      "<path d='M5 19c0-8 6-14 14-14 0 8-6 14-14 14z'/><path d='M8 16c3-3.5 6.5-5.5 9-6.5'/>",
    batteries:       "<rect x='3' y='8' width='15' height='9' rx='1.5'/><path d='M18 11h2.5v3H18z'/><path d='M8 10.5v4M11.5 10.5v4'/>",
    energy:          "<path d='M13 3L5 14h6l-1 7 8-11h-6z'/>",
    infrastructure:  "<path d='M3 8v11M21 8v11'/><path d='M3 12c6 4.5 12 4.5 18 0'/><path d='M7.5 12.7V19M12 13.6V19M16.5 12.7V19'/>",
    manufacturing:   "<path d='M4 20V10l5 3V10l5 3V7l5 3v10z'/><path d='M8 20v-3.5M13 20v-3.5'/>",
    healthcare:      "<path d='M3 12h4l2-4 3.5 8L15 12h6'/>",
    chemicals:       "<path d='M9 3h6M10 3v6.5L4.8 18.3A2 2 0 006.5 21.3h11a2 2 0 001.7-3L14 9.5V3'/><path d='M7.6 15.5h8.8'/>",
    pharmaceuticals: "<rect x='3.5' y='9' width='17' height='6' rx='3' transform='rotate(-40 12 12)'/><path d='M9.2 14.8L14.8 9.2'/>",
    agriculture:     "<path d='M12 21v-9'/><path d='M12 12C12 8 9 5.5 4.5 5.5 4.5 9.5 7.5 12 12 12z'/><path d='M12 12.5c0-3.2 2.2-5.2 6.2-5.2 0 3.2-2.2 5.2-6.2 5.2z'/>",
    building:        "<rect x='6' y='3.5' width='12' height='17' rx='1'/><path d='M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2'/><path d='M10 20.5v-2.5h4v2.5'/>",
    marine:          "<circle cx='12' cy='5' r='2'/><path d='M12 7v12'/><path d='M7 11h10'/><path d='M5 14c0 4 3.2 5.5 7 5.5s7-1.5 7-5.5'/>",
    defence:         "<path d='M12 3l7 3v5.5c0 5-3 8.2-7 9.5-4-1.3-7-4.5-7-9.5V6z'/>",
    academia:        "<path d='M12 5L2.5 9 12 13l9.5-4z'/><path d='M6 11.2V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.8'/><path d='M21.5 9v4.5'/>",
    rail:            "<rect x='6' y='4' width='12' height='13' rx='2'/><path d='M8 8h8M9 17l-2.5 3M15 17l2.5 3'/><circle cx='9.5' cy='13.5' r='1'/><circle cx='14.5' cy='13.5' r='1'/>",
    semiconductors:  "<rect x='7.5' y='7.5' width='9' height='9' rx='1'/><path d='M10 4v3.5M14 4v3.5M10 16.5V20M14 16.5V20M4 10h3.5M4 14h3.5M16.5 10H20M16.5 14H20'/>",
    robotics:        "<rect x='6' y='8' width='12' height='10' rx='2'/><path d='M12 4v4M9.5 12.5h.01M14.5 12.5h.01M8 18v2M16 18v2'/><circle cx='12' cy='4' r='1.2'/>",
    water:           "<path d='M12 3s6.5 7.5 6.5 12A6.5 6.5 0 0 1 5.5 15C5.5 10.5 12 3 12 3z'/>",

  var cv = document.getElementById("net");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1, NODES = 32;
  var pts = [], edges = [], pulses = [], clock = 0;
  var NODE_SHAPES = ["pill", "box", "boxsoft", "decision", "output", "model"];
  // no per-node colour -- a real flowchart's nodes are one uniform style
  var HUES = ["#6E6E6E", "#6E6E6E", "#6E6E6E", "#6E6E6E"];
  var NET_EDGE = "rgba(20,20,20,.30)", NET_PULSE = "rgba(17,17,17,.55)",
      NET_NODE_FILL = "#fff", NET_NODE_STROKE = "rgba(90,90,90,.55)",
      NET_SHADOW = "rgba(0,0,0,.28)";

  // Canvas fill/strokeStyle can't read CSS variables directly -- cache
  // resolved colours here whenever the theme changes (see applyTheme below).
  function refreshNetColors() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    // match the real workflow-canvas node/wire tones
    NET_EDGE = dark ? "rgba(242,242,242,.26)" : "rgba(20,20,20,.30)";
    NET_PULSE = dark ? "rgba(242,242,242,.7)" : "rgba(17,17,17,.6)";
    NET_NODE_FILL = dark ? "#242424" : "#FFFFFF";
    NET_NODE_STROKE = dark ? "rgba(210,210,210,.42)" : "rgba(90,90,90,.55)";
    NET_SHADOW = dark ? "rgba(0,0,0,.6)" : "rgba(0,0,0,.28)";
  }

  // Re-skins this iframe's own --bg/--ink/etc. palette (see :root /
  // :root[data-theme="dark"] in <style>) plus the canvas colours above.
  // Must run on EVERY render call, independent of the `md === lastMd`
  // early-return in the message handler below -- a theme-only rerun still
  // carries the same markdown.
  function applyTheme(theme) {
    var t = theme === "dark" ? "dark" : "light";
    if (document.documentElement.getAttribute("data-theme") !== t) {
      document.documentElement.setAttribute("data-theme", t);
    }
    refreshNetColors();
  }

  function seed() {
    pts = [];
    for (var i = 0; i < NODES; i++) {
      var shape = NODE_SHAPES[(Math.random() * NODE_SHAPES.length) | 0];
      pts.push({
        x: 0.05 + Math.random() * 0.9, y: 0.06 + Math.random() * 0.88,
        vx: (Math.random() - 0.5) * 0.00022, vy: (Math.random() - 0.5) * 0.00022,
        hue: i % 7 === 0 ? HUES[(Math.random() * 4) | 0] : null,
        shape: shape,
        // pills sit a touch wider/flatter; the rest are near-square cards
        w: (shape === "pill" ? 14 : 9) + Math.random() * 6,
        ar: shape === "pill" ? 0.44 : 0.62 + Math.random() * 0.16
      });
    }
    var raw = [];
    for (var a = 0; a < NODES; a++) {
      var b1 = [1e9, -1], b2 = [1e9, -1];
      for (var b = 0; b < NODES; b++) {
        if (a === b) continue;
        var dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, d = dx * dx + dy * dy;
        if (d < b1[0]) { b2 = b1; b1 = [d, b]; } else if (d < b2[0]) { b2 = [d, b]; }
      }
      [b1, b2].forEach(function (p) {
        if (p[1] < 0) return;
        var lo = Math.min(a, p[1]), hi = Math.max(a, p[1]);
        if (!raw.some(function (e) { return e[0] === lo && e[1] === hi; })) raw.push([lo, hi]);
      });
    }
    edges = raw; pulses = [];
  }

  // Rounded-rectangle path with per-corner radii [tl, tr, br, bl] (or one
  // number). No dependency on the newish ctx.roundRect().
  function rrect(x, y, w, h, r) {
    var tl, tr, br, bl;
    if (r.length) { tl = r[0]; tr = r[1]; br = r[2]; bl = r[3]; }
    else { tl = tr = br = bl = r; }
    var m = Math.min(w, h) / 2;
    tl = Math.min(tl, m); tr = Math.min(tr, m); br = Math.min(br, m); bl = Math.min(bl, m);
    ctx.beginPath();
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    ctx.arcTo(x + w, y, x + w, y + tr, tr);
    ctx.lineTo(x + w, y + h - br);
    ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
    ctx.lineTo(x + bl, y + h);
    ctx.arcTo(x, y + h, x, y + h - bl, bl);
    ctx.lineTo(x, y + tl);
    ctx.arcTo(x, y, x + tl, y, tl);
    ctx.closePath();
  }

  function nodePath(shape, x, y, w, h) {
    var s = Math.min(w, h);
    if (shape === "pill")     return rrect(x, y, w, h, h / 2);
    if (shape === "box")      return rrect(x, y, w, h, 1);
    if (shape === "model")    return rrect(x, y, w, h, s * 0.16);
    if (shape === "boxsoft")  return rrect(x, y, w, h, s * 0.34);
    if (shape === "decision") return rrect(x, y, w, h, [s * 0.5, 1, s * 0.5, 1]);
    /* output */              return rrect(x, y, w, h, [1, 1, s * 0.5, s * 0.5]);
  }

  // Connection routing in the title-hero's principle: leave a node along one
  // axis, ease through an S-bend, arrive along the same axis -- a cubic
  // Bezier whose control handles sit at the midpoint (mid-x for a mostly-
  // horizontal link, mid-y otherwise).
  function edgeCurve(a, b) {
    if (Math.abs(b[0] - a[0]) >= Math.abs(b[1] - a[1])) {
      var mx = (a[0] + b[0]) / 2;
      return [a, [mx, a[1]], [mx, b[1]], b];
    }
    var my = (a[1] + b[1]) / 2;
    return [a, [a[0], my], [b[0], my], b];
  }
  function bezAt(c, t) {
    var u = 1 - t, a = u * u * u, bb = 3 * u * u * t, cc = 3 * u * t * t, d = t * t * t;
    return [
      a * c[0][0] + bb * c[1][0] + cc * c[2][0] + d * c[3][0],
      a * c[0][1] + bb * c[1][1] + cc * c[2][1] + d * c[3][1]
    ];
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.max(1, W * DPR); cv.height = Math.max(1, H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (reduce) frame();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (!reduce) {
      for (var i = 0; i < NODES; i++) {
        var p = pts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0.03 || p.x > 0.97) p.vx *= -1;
        if (p.y < 0.05 || p.y > 0.95) p.vy *= -1;
      }
    }
    var S = pts.map(function (p) { return [p.x * W, p.y * H]; });

    ctx.strokeStyle = NET_EDGE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      var c = edgeCurve(S[edges[e][0]], S[edges[e][1]]);
      ctx.moveTo(c[0][0], c[0][1]);
      ctx.bezierCurveTo(c[1][0], c[1][1], c[2][0], c[2][1], c[3][0], c[3][1]);
    }
    ctx.stroke();

    if (!reduce && edges.length) {
      clock++;
      if (clock % 48 === 0 && pulses.length < 5) pulses.push({ e: (Math.random() * edges.length) | 0, t: 0 });
      ctx.fillStyle = NET_PULSE;
      for (var q = pulses.length - 1; q >= 0; q--) {
        var P = pulses[q]; P.t += 0.02;
        if (P.t >= 1) { pulses.splice(q, 1); continue; }
        var pt = bezAt(edgeCurve(S[edges[P.e][0]], S[edges[P.e][1]]), P.t);
        ctx.fillRect(pt[0] - 1.5, pt[1] - 1.5, 3, 3);
      }
    }

    for (var n = 0; n < NODES; n++) {
      var p = pts[n], w = p.w, h = w * p.ar;
      var x0 = S[n][0] - w / 2, y0 = S[n][1] - h / 2;
      nodePath(p.shape, x0, y0, w, h);
      ctx.shadowColor = NET_SHADOW; ctx.shadowBlur = 7; ctx.shadowOffsetY = 2.5;
      ctx.fillStyle = NET_NODE_FILL;
      ctx.fill();
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.strokeStyle = p.hue || NET_NODE_STROKE;
      ctx.lineWidth = p.hue ? 1.6 : 1;
      ctx.stroke();
    }
  }

  var raf;
  function loop() { frame(); raf = requestAnimationFrame(loop); }
  var rzt;
  window.addEventListener("resize", function () { clearTimeout(rzt); rzt = setTimeout(resize, 120); });
  document.addEventListener("visibilitychange", function () {
    cancelAnimationFrame(raf);
    if (!document.hidden && !reduce) raf = requestAnimationFrame(loop);
  });

  /* ---- boot + Streamlit render loop --------------------------------- */
  refreshNetColors();
  seed();
  setViewportHeight();
  resize();
  if (reduce) frame(); else raf = requestAnimationFrame(loop);

  window.addEventListener("message", function (event) {
    var d = event.data || {};
    if (d.type !== "streamlit:render") return;
    applyTheme(d.args && d.args.theme);   // first -- re-skin runs on every render, incl. a markdown-unchanged rerun
    var md = (d.args && d.args.markdown) || "";
    if (md === lastMd) { return; }
    lastMd = md;
    build(md);
    requestAnimationFrame(function () { requestAnimationFrame(resize); });
  });

  // ---- external nav API ------------------------------------------------
  // The parent page's left rail (styles.css #tw-navrail) calls these to
  // read the slide count / current slide and to jump to a slide. Same-origin
  // access, like setViewportHeight(); a cross-origin deploy just means the
  // rail can't drive slide changes (its app / examples ends still work).
  window.__deckAPI = {
    count: function () { return slides.length; },
    index: function () { return idx; },
    goto: function (k) {
      if (!slides.length) return;
      k = Math.max(0, Math.min(k | 0, slides.length - 1));
      scrollToSlide(k);
    }
  };

  send("streamlit:componentReady", { apiVersion: 1 });
  setViewportHeight();
})();
</script>
</body>
</html>
