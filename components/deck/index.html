<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
<style>
  /* -------------------------------------------------------------------------
     testware.dev — in-app presentation deck (the Dashboard section).
     Renders presentation.md as a one-slide-at-a-time, scroll-snapped
     sequence -- this iframe owns its own bounded, internally-scrolling
     viewport (sized to ~the outer page's visible height, see setViewportHeight()
     below), independent of the rest of the (plain-scrolling) page. One
     colour world: the app's own warm-cream / near-black palette and
     typeface (Source Sans 3), with a little presentation flourish -- a
     faint connecting-node network and staged slide entrances. Edit slides
     in presentation.md, not here.
     ---------------------------------------------------------------------- */
  /* NOTE: hand-copied from styles.css's --tw-* tokens (and
     components/workflow/index.html's --wf-* tokens) under yet another naming
     convention -- no single source of truth across the three files, so a
     palette change here must be mirrored in both of them by hand. */
  :root {
    --bg: #FBFAF7;
    --bg-elevated: #FFFFFF;
    --panel: rgba(255, 255, 255, .82);
    --panel-2: #F1EFE9;
    --ink: #1A1A1A;
    --muted: #6B6B66;
    --hair: #E7E3DA;
    --accent: #111111;
    --font: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  /* app.py passes theme= into deck_view(); applyTheme() (see script below)
     stamps this attribute on load and on every theme-only rerun. */
  :root[data-theme="dark"] {
    --bg: #15140F;
    --bg-elevated: #1E1C16;
    --panel: rgba(30, 28, 22, .82);
    --panel-2: #262319;
    --ink: #F3F1EA;
    --muted: #9C9788;
    --hair: #34311F;
    --accent: #F3F1EA;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  #net { position: fixed; inset: 0; z-index: 0; display: block; pointer-events: none; }

  /* The ONE scrolling element in this document -- deliberately not `body`
     (avoids the standards-mode html-vs-body "scrollingElement" ambiguity).
     No forced scroll-snap -- tried mandatory, then proximity, both still
     read as fighting the user's own scroll (hard to scroll back up).
     scroll-behavior:smooth plus each slide being a full screen tall (below)
     keeps the "one slide at a time" impression without a hard snap forcing
     it. Re-add `scroll-snap-type: y proximity;` here if free scroll ever
     feels too loose -- everything else is unaffected either way. */
  #scroller {
    position: relative;
    z-index: 1;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* Each slide is AT LEAST this iframe's own (bounded) viewport tall
     (min-height, not a fixed height) so a slide with more content than
     fits in one screen -- a tall image, a long list -- grows instead of
     clipping. scroll-snap-align stays (harmless with no scroll-snap-type
     set -- it's a no-op until/unless proximity comes back). */
  .slide {
    min-height: 100vh;
    scroll-snap-align: start;
    display: grid;
    place-items: center;
    padding: clamp(3.5rem, 9vw, 5.5rem) clamp(1.25rem, 6vw, 5rem) clamp(2.25rem, 5vw, 3.5rem);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .slide.is-visible { opacity: 1; transform: none; }

  .frame { width: min(1000px, 100%); }
  .slide[data-layout="content"] .frame,
  .slide[data-layout="media"] .frame,
  .slide[data-layout="split"] .frame,
  .slide[data-layout="quote"] .frame {
    background: var(--panel);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    border: 1px solid var(--hair);
    border-radius: 20px;
    padding: clamp(1.5rem, 4vw, 3rem);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 24px 60px rgba(0, 0, 0, .07);
  }
  .slide[data-layout="title"] .frame,
  .slide[data-layout="section"] .frame,
  .slide[data-layout="quote"] .frame { text-align: center; }
  .slide[data-layout="media"] .frame,
  .slide[data-layout="split"] .frame {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1.25rem, 3vw, 2.5rem);
    align-items: center;
  }
  @media (max-width: 760px) {
    .slide[data-layout="media"] .frame,
    .slide[data-layout="split"] .frame { grid-template-columns: 1fr; }
  }
  .col-b { min-width: 0; }

  .kicker {
    font-size: clamp(.66rem, 1.4vw, .8rem);
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .headline {
    font-weight: 700;
    font-size: clamp(1.85rem, 4.6vw, 3.3rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-wrap: balance;
    max-width: 22ch;
  }
  .slide[data-layout="title"] .headline { font-size: clamp(2.4rem, 7vw, 4.6rem); margin-inline: auto; }
  .slide[data-layout="section"] .headline { font-size: clamp(2.1rem, 6vw, 3.9rem); max-width: 18ch; margin-inline: auto; }
  .headline i, .headline em { font-style: normal; color: var(--accent); }
  .subhead {
    font-size: clamp(1rem, 2vw, 1.3rem);
    line-height: 1.5;
    color: var(--muted);
    max-width: 46ch;
    margin-top: 1rem;
  }
  .slide[data-layout="title"] .subhead,
  .slide[data-layout="section"] .subhead { margin-inline: auto; }
  .body {
    font-size: clamp(.98rem, 1.7vw, 1.15rem);
    line-height: 1.6;
    max-width: 54ch;
    margin-top: 1rem;
    color: var(--ink);
  }
  .body strong { font-weight: 700; }
  .body a, .list a, .subhead a { color: var(--accent); text-underline-offset: 2px; }

  .list {
    list-style: none;
    margin-top: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: .8rem;
    max-width: 54ch;
  }
  .list li {
    position: relative;
    padding-left: 1.4rem;
    font-size: clamp(.98rem, 1.8vw, 1.18rem);
    line-height: 1.45;
  }
  .list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .58em;
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--accent);
  }
  .list li strong { font-weight: 700; }

  .quote {
    font-size: clamp(1.35rem, 3vw, 2.05rem);
    line-height: 1.4;
    letter-spacing: -0.01em;
    max-width: 26ch;
    margin-inline: auto;
  }
  .quote + .body { margin-top: 1.1rem; color: var(--muted); }

  figure.media { margin: 0; }
  figure.media img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 55vh;   /* shrink to fit one screen instead of forcing extra scroll to see the rest */
    border-radius: 14px;
    border: 1px solid var(--hair);
    background: var(--panel-2);
  }
  figure.media figcaption {
    margin-top: .6rem;
    font-size: .85rem;
    line-height: 1.4;
    color: var(--muted);
  }

  /* staged entrance */
  [data-anim] { opacity: 0; transform: translateY(14px); }
  .slide.is-visible [data-anim] {
    opacity: 1;
    transform: none;
    transition: opacity .55s var(--ease), transform .55s var(--ease);
    transition-delay: calc(var(--i, 0) * 70ms);
  }

  /* ---- chrome: dot-nav only, fixed within this iframe's own (real again)
     viewport -- floats above every slide as you scroll, exactly like the
     original pre-redesign deck. */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    justify-content: center;
    padding: clamp(1rem, 3vw, 1.5rem) 1rem;
    transition: opacity .35s var(--ease);
  }
  body.idle #topbar { opacity: .35; }
  .dots { display: flex; gap: .34rem; }
  .dot {
    width: 1.35rem;
    height: 2px;
    background: var(--hair);
    cursor: pointer;
    transition: background .25s var(--ease);
  }
  .dot.on { background: var(--accent); }
  .dot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .empty {
    height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    padding: 2rem;
    font-size: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
    [data-anim] { opacity: 1 !important; transform: none !important; }
    .slide { transform: none !important; }
    #scroller { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <canvas id="net" aria-hidden="true"></canvas>

  <div id="topbar">
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <div id="scroller">
    <div id="deck"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ---- raw Streamlit component protocol (mirrors components/workflow) ---- */
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var scroller = document.getElementById("scroller");
  var deck = document.getElementById("deck");
  var dotsWrap = document.getElementById("dots");

  var slides = [];
  var idx = 0;
  var lastMd = null;
  var HEADER_OFFSET = 80;   // clears the outer page's sticky header (styles.css)
  var FALLBACK_HEIGHT = 800;

  /* ---- tiny markdown -> slides (unchanged from the original parser) ---- */
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function inl(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\b_([^_]+)_\b/g, "<em>$1</em>");
    s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  function parse(src) {
    var parts = String(src || "").replace(/\r\n?/g, "\n").split(/\n[ \t]*(?:-{3,}|\*{3,})[ \t]*\n/);
    var out = [];
    parts.forEach(function (chunk, si) {
      var lines = chunk.split("\n");
      var blocks = [], forced = null, i = 0;
      while (i < lines.length) {
        var t = lines[i].trim();
        if (!t) { i++; continue; }
        var m;
        if ((m = t.match(/^<!--\s*layout:\s*([a-z]+)\s*-->$/i))) { forced = m[1].toLowerCase(); i++; continue; }
        if (/^<!--/.test(t)) { while (i < lines.length && !/-->/.test(lines[i])) i++; i++; continue; }
        if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
          var lvl = m[1].length;
          blocks.push({ t: lvl >= 4 ? "kicker" : lvl === 3 ? "subhead" : "headline", h: inl(m[2]) });
          i++; continue;
        }
        if ((m = t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/))) { blocks.push({ t: "media", src: m[2], cap: m[1] }); i++; continue; }
        if (/^>\s?/.test(t)) {
          var q = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
          blocks.push({ t: "quote", h: inl(q.join(" ")) });
          continue;
        }
        if (/^[-*+]\s+/.test(t)) {
          var items = [];
          while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) { items.push(inl(lines[i].trim().replace(/^[-*+]\s+/, ""))); i++; }
          blocks.push({ t: "list", items: items });
          continue;
        }
        var para = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>\s?|[-*+]\s|!\[|<!--)/.test(lines[i].trim())) {
          para.push(lines[i].trim()); i++;
        }
        blocks.push({ t: "p", h: inl(para.join(" ")) });
      }
      if (!blocks.length) return;
      out.push({ layout: forced || infer(blocks, si), blocks: blocks });
    });
    return out;
  }

  function infer(blocks, si) {
    var k = blocks.map(function (b) { return b.t; });
    var has = function (x) { return k.indexOf(x) !== -1; };
    if (si === 0) return "title";
    if (has("media") && !has("list")) return "media";
    if (has("quote") && !has("list")) return "quote";
    if (!has("list") && !has("p") && !has("media") && !has("quote") && !has("subhead")) return "section";
    return "content";
  }

  function blockEl(b) {
    var e;
    if (b.t === "list") {
      e = document.createElement("ul");
      e.className = "list";
      b.items.forEach(function (it) {
        var li = document.createElement("li");
        li.innerHTML = it;
        e.appendChild(li);
      });
    } else if (b.t === "media") {
      e = document.createElement("figure");
      e.className = "media";
      var img = document.createElement("img");
      img.src = b.src;
      img.alt = b.cap || "";
      img.loading = "lazy";
      e.appendChild(img);
      if (b.cap) {
        var fc = document.createElement("figcaption");
        fc.textContent = b.cap;
        e.appendChild(fc);
      }
    } else {
      var tag = b.t === "headline" ? "h2" : b.t === "quote" ? "blockquote" : b.t === "kicker" ? "p" : b.t === "subhead" ? "p" : "p";
      e = document.createElement(tag);
      e.className = b.t === "headline" ? "headline" : b.t === "quote" ? "quote" : b.t === "kicker" ? "kicker" : b.t === "subhead" ? "subhead" : "body";
      e.innerHTML = b.h;
    }
    return e;
  }

  function build(md) {
    var parsed = parse(md);
    deck.innerHTML = "";

    if (!parsed.length) {
      var em = document.createElement("div");
      em.className = "empty";
      em.textContent = "Add slides to presentation.md — separate each with a line of ---";
      deck.appendChild(em);
      slides = [];
      renderChrome();
      return;
    }

    slides = parsed.map(function (s) {
      var sec = document.createElement("section");
      sec.className = "slide";
      sec.dataset.layout = s.layout;
      var frame = document.createElement("div");
      frame.className = "frame";

      var twoCol = s.layout === "media" || s.layout === "split";
      var colA = frame, colB = null;
      if (twoCol) {
        colA = document.createElement("div"); colA.className = "col-a";
        colB = document.createElement("div"); colB.className = "col-b";
        frame.appendChild(colA); frame.appendChild(colB);
      }

      var ai = 0;
      s.blocks.forEach(function (b) {
        var el = blockEl(b);
        el.setAttribute("data-anim", "");
        el.style.setProperty("--i", ai++);
        if (twoCol && (b.t === "media" || (s.layout === "split" && b.t !== "headline" && b.t !== "kicker"))) {
          colB.appendChild(el);
        } else {
          colA.appendChild(el);
        }
      });
      if (twoCol && colB && !colB.children.length) { colB.remove(); frame.style.gridTemplateColumns = "1fr"; }

      sec.appendChild(frame);
      deck.appendChild(sec);
      return sec;
    });

    idx = 0;
    renderChrome();
    installObserver();
  }

  function renderChrome() {
    dotsWrap.innerHTML = "";
    slides.forEach(function (_, k) {
      var d = document.createElement("span");
      d.className = "dot";
      d.tabIndex = 0;
      d.setAttribute("role", "button");
      d.setAttribute("aria-label", "Slide " + (k + 1));
      d.addEventListener("click", function () { scrollToSlide(k); });
      d.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); scrollToSlide(k); } });
      dotsWrap.appendChild(d);
    });
    updateChrome();
  }

  function updateChrome() {
    for (var k = 0; k < dotsWrap.children.length; k++) dotsWrap.children[k].classList.toggle("on", k <= idx);
  }

  // Internal scroll -- #scroller is the ONE scrolling element in this
  // document, so this is a plain same-document scrollIntoView(). No
  // cross-frame coordination needed (unlike the outer page's own sections).
  function scrollToSlide(k) {
    var el = slides[k];
    if (!el) return;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  window.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "Home") { e.preventDefault(); scrollToSlide(0); }
    else if (k === "End") { e.preventDefault(); scrollToSlide(slides.length - 1); }
  });

  // Reveal each slide (staged entrance) the first time it scrolls into
  // view, and keep the dot chrome tracking which slide is current. Rooted
  // at #scroller -- the actual (and only) scrolling element in THIS
  // document, so this is a standard, same-document IntersectionObserver
  // usage (no cross-frame "implicit root" concerns). Never calls
  // setValue() / reports anything back to Streamlit -- purely local, so
  // scrolling never triggers a rerun.
  var io = null;
  function installObserver() {
    if (io) io.disconnect();
    if (!("IntersectionObserver" in window) || !slides.length) return;
    io = new IntersectionObserver(function (entries) {
      var bestK = -1, bestRatio = 0;
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add("is-visible");
        var k = slides.indexOf(entry.target);
        if (k !== -1 && entry.intersectionRatio > bestRatio) { bestRatio = entry.intersectionRatio; bestK = k; }
      });
      if (bestK !== -1) { idx = bestK; updateChrome(); }
    }, { root: scroller, threshold: [0, 0.25, 0.5, 0.75, 1] });
    slides.forEach(function (s) { io.observe(s); });
  }

  // ---- height --------------------------------------------------------
  // This iframe owns its own bounded viewport again (one slide = 100vh of
  // IT, not of the outer page) -- sized to ~match the outer page's visible
  // height so a slide reads as "near full screen". Same-origin access to
  // window.parent; falls back to a fixed height if that's ever blocked.
  function setViewportHeight() {
    var h;
    try {
      h = Math.max(320, Math.round(window.parent.innerHeight - HEADER_OFFSET));
    } catch (e) {
      h = FALLBACK_HEIGHT;
    }
    setHeight(h);
  }
  var rt;
  try {
    window.parent.addEventListener("resize", function () {
      clearTimeout(rt);
      rt = setTimeout(setViewportHeight, 150);
    }, { passive: true });
  } catch (e) { /* cross-origin -- height just won't track a parent resize */ }

  var idleT;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add("idle"); }, 3400);
  }
  ["mousemove", "keydown", "pointerdown"].forEach(function (ev) { window.addEventListener(ev, wake, { passive: true }); });
  scroller.addEventListener("scroll", wake, { passive: true });
  wake();

  /* ---- connecting-node network (app palette, faint) ------------------- */
  var cv = document.getElementById("net");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1, NODES = 40;
  var pts = [], edges = [], pulses = [], clock = 0;
  var HUES = ["#3F7D78", "#A9822F", "#3F7D55", "#54628A"];
  var NET_EDGE = "rgba(26,26,26,.11)", NET_PULSE = "rgba(17,17,17,.55)",
      NET_NODE_FILL = "#fff", NET_NODE_STROKE = "rgba(26,26,26,.30)";

  // Canvas fill/strokeStyle can't read CSS variables directly -- cache
  // resolved colours here whenever the theme changes (see applyTheme below).
  function refreshNetColors() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    NET_EDGE = dark ? "rgba(243,241,234,.13)" : "rgba(26,26,26,.11)";
    NET_PULSE = dark ? "rgba(243,241,234,.6)" : "rgba(17,17,17,.55)";
    NET_NODE_FILL = dark ? "#1E1C16" : "#fff";
    NET_NODE_STROKE = dark ? "rgba(243,241,234,.34)" : "rgba(26,26,26,.30)";
  }

  // Re-skins this iframe's own --bg/--ink/etc. palette (see :root /
  // :root[data-theme="dark"] in <style>) plus the canvas colours above.
  // Must run on EVERY render call, independent of the `md === lastMd`
  // early-return in the message handler below -- a theme-only rerun still
  // carries the same markdown.
  function applyTheme(theme) {
    var t = theme === "dark" ? "dark" : "light";
    if (document.documentElement.getAttribute("data-theme") !== t) {
      document.documentElement.setAttribute("data-theme", t);
    }
    refreshNetColors();
  }

  function seed() {
    pts = [];
    for (var i = 0; i < NODES; i++) {
      pts.push({
        x: 0.05 + Math.random() * 0.9, y: 0.06 + Math.random() * 0.88,
        vx: (Math.random() - 0.5) * 0.00022, vy: (Math.random() - 0.5) * 0.00022,
        hue: i % 7 === 0 ? HUES[(Math.random() * 4) | 0] : null
      });
    }
    var raw = [];
    for (var a = 0; a < NODES; a++) {
      var b1 = [1e9, -1], b2 = [1e9, -1];
      for (var b = 0; b < NODES; b++) {
        if (a === b) continue;
        var dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, d = dx * dx + dy * dy;
        if (d < b1[0]) { b2 = b1; b1 = [d, b]; } else if (d < b2[0]) { b2 = [d, b]; }
      }
      [b1, b2].forEach(function (p) {
        if (p[1] < 0) return;
        var lo = Math.min(a, p[1]), hi = Math.max(a, p[1]);
        if (!raw.some(function (e) { return e[0] === lo && e[1] === hi; })) raw.push([lo, hi]);
      });
    }
    edges = raw; pulses = [];
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.max(1, W * DPR); cv.height = Math.max(1, H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (reduce) frame();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (!reduce) {
      for (var i = 0; i < NODES; i++) {
        var p = pts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0.03 || p.x > 0.97) p.vx *= -1;
        if (p.y < 0.05 || p.y > 0.95) p.vy *= -1;
      }
    }
    var S = pts.map(function (p) { return [p.x * W, p.y * H]; });

    ctx.strokeStyle = NET_EDGE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      ctx.moveTo(S[edges[e][0]][0], S[edges[e][0]][1]);
      ctx.lineTo(S[edges[e][1]][0], S[edges[e][1]][1]);
    }
    ctx.stroke();

    if (!reduce && edges.length) {
      clock++;
      if (clock % 48 === 0 && pulses.length < 5) pulses.push({ e: (Math.random() * edges.length) | 0, t: 0 });
      ctx.fillStyle = NET_PULSE;
      for (var q = pulses.length - 1; q >= 0; q--) {
        var P = pulses[q]; P.t += 0.02;
        if (P.t >= 1) { pulses.splice(q, 1); continue; }
        var A = S[edges[P.e][0]], B = S[edges[P.e][1]];
        ctx.fillRect(A[0] + (B[0] - A[0]) * P.t - 1.5, A[1] + (B[1] - A[1]) * P.t - 1.5, 3, 3);
      }
    }

    for (var n = 0; n < NODES; n++) {
      ctx.fillStyle = NET_NODE_FILL;
      ctx.beginPath(); ctx.arc(S[n][0], S[n][1], 3.2, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = pts[n].hue || NET_NODE_STROKE;
      ctx.lineWidth = pts[n].hue ? 1.8 : 1;
      ctx.beginPath(); ctx.arc(S[n][0], S[n][1], 3.2, 0, 6.2832); ctx.stroke();
    }
  }

  var raf;
  function loop() { frame(); raf = requestAnimationFrame(loop); }
  var rzt;
  window.addEventListener("resize", function () { clearTimeout(rzt); rzt = setTimeout(resize, 120); });
  document.addEventListener("visibilitychange", function () {
    cancelAnimationFrame(raf);
    if (!document.hidden && !reduce) raf = requestAnimationFrame(loop);
  });

  /* ---- boot + Streamlit render loop --------------------------------- */
  refreshNetColors();
  seed();
  setViewportHeight();
  resize();
  if (reduce) frame(); else raf = requestAnimationFrame(loop);

  window.addEventListener("message", function (event) {
    var d = event.data || {};
    if (d.type !== "streamlit:render") return;
    applyTheme(d.args && d.args.theme);   // first -- re-skin runs on every render, incl. a markdown-unchanged rerun
    var md = (d.args && d.args.markdown) || "";
    if (md === lastMd) { return; }
    lastMd = md;
    build(md);
    requestAnimationFrame(function () { requestAnimationFrame(resize); });
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setViewportHeight();
})();
</script>
</body>
