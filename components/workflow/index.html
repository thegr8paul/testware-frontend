<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="drawflow.min.css" />
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, sans-serif;
    color: #111111;
  }
  /* liquid-glass panel -- kept in sync with GLASS_PANEL_CSS in app.py */
  #panel {
    position: absolute; inset: 0;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 16px;
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.28)),
      rgba(220, 225, 235, 0.30);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    overflow: hidden;
  }
  /* inset inside the rounded panel so connection curves near the edges
     aren't clipped by #panel's overflow:hidden + border-radius */
  #canvas { position: absolute; inset: 10px; border-radius: 10px; overflow: hidden; }
  /* CRITICAL: Drawflow's connection math divides by precanvas.clientWidth/
     Height; if .parent-drawflow has no height it is 0 and every line
     collapses to the corner. Drawflow's own CSS sizes .drawflow but NOT
     .parent-drawflow -- force it here. */
  .parent-drawflow, .drawflow { width: 100%; height: 100%; }
  .drawflow { background: transparent; }
  .parent-drawflow { cursor: grab; }
  .parent-drawflow:active { cursor: grabbing; }

  /* --- node card --------------------------------------------------------
     The visible card IS the .drawflow-node element, so Drawflow anchors the
     ports exactly on this box's edges. Keep box-sizing:border-box and use
     `outline` (not an inflating box-shadow) for the suggested ring so the
     box never changes size. */
  .drawflow .drawflow-node {
    box-sizing: border-box;
    width: 200px;
    border: 1px solid rgba(120, 120, 120, 0.55);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    background: rgba(255, 255, 255, 0.55);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
  }
  .drawflow .drawflow-node.selected { outline: 2px solid rgba(17, 17, 17, 0.35); }

  .drawflow-node .twn-title { font-weight: 600; line-height: 1.2; }
  .drawflow-node .twn-badge {
    position: absolute; top: -8px; right: -8px;
    background: #111; color: #fff; font-size: 9px; font-weight: 700;
    letter-spacing: .5px; padding: 2px 5px; border-radius: 6px;
  }

  /* Port rows. The body is pulled out to the card's border so each port's
     .dot sits ON the left (inputs) or right (outputs) edge -- that .dot is
     the anchor the wire connects to. */
  .drawflow-node .twn-body { margin: 5px -10px 0; display: flex; }
  .drawflow-node .twn-col { flex: 1 1 0; min-width: 0; }
  .drawflow-node .twn-port {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: #555; line-height: 1.7; padding: 0 3px;
  }
  .drawflow-node .twn-col.out .twn-port { flex-direction: row-reverse; }
  .drawflow-node .twn-port span {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drawflow-node .twn-port .dot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: #fff; border: 1.6px solid #6a6a6a;
  }
  .drawflow-node.t-model .twn-port .dot    { border-color: rgba(63,125,120,0.85); }
  .drawflow-node.t-decision .twn-port .dot { border-color: rgba(169,130,47,0.85); }
  .drawflow-node.t-output .twn-port .dot,
  .drawflow-node.t-database .twn-port .dot { border-color: rgba(84,98,138,0.85); }

  /* per-type tint + texture. Class is "t-<type>" (backend node type:
     input | process | model | decision | merge | output | database). */
  .drawflow-node.t-input    { background: rgba(255,255,255,0.55); }
  .drawflow-node.t-process  { background:
      radial-gradient(rgba(17,17,17,0.10) 0.9px, transparent 0.9px) 0 0 / 10px 10px,
      rgba(255,255,255,0.55); }
  .drawflow-node.t-merge    { background:
      linear-gradient(rgba(17,17,17,0.07) 1px, transparent 1px) 0 0 / 100% 10px,
      rgba(255,255,255,0.55); }
  .drawflow-node.t-model    { background:
      repeating-linear-gradient(45deg, rgba(17,17,17,0.09) 0 1px, transparent 1px 8px),
      rgba(63,125,120,0.22);
      border-color: rgba(63,125,120,0.60); }
  .drawflow-node.t-decision { background:
      repeating-linear-gradient(0deg, rgba(17,17,17,0.08) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(90deg, rgba(17,17,17,0.08) 0 1px, transparent 1px 8px),
      rgba(169,130,47,0.22);
      border-color: rgba(169,130,47,0.60); }
  .drawflow-node.t-output   { background: rgba(63,125,85,0.22); border-color: rgba(63,125,85,0.60); }

  /* database -- indigo/slate tint, elliptical top+bottom edges (cylinder
     silhouette) and a faint DB-cylinder glyph watermark in the corner. */
  .drawflow-node.t-database {
    border-color: rgba(84,98,138,0.60);
    border-radius: 10px / 26px;
    background:
      no-repeat right -6px bottom -8px / 42px
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="rgba(17,17,17,0.16)" stroke-width="1.6"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.66 3.13 3 7 3s7-1.34 7-3V5"/><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"/></svg>'),
      rgba(84,98,138,0.20);
  }

  /* suggested: outline does NOT change the box size, so ports stay put */
  .drawflow-node.is-suggested { outline: 2px solid #FF4B4B; outline-offset: 1px; }

  /* Drawflow's own connection renderer AND its floating port dots are
     unreliable inside a scaled, iframe-hosted canvas. Hide both; we draw the
     edges (and their endpoint dots) ourselves in #wires, anchored to the
     visible node-box edges, recomputed on every pan / zoom / resize. */
  .drawflow .connection { display: none !important; }
  .drawflow .drawflow-node .input,
  .drawflow .drawflow-node .output { display: none !important; }
  #wires {
    position: absolute; inset: 0; z-index: 0;
    pointer-events: none; overflow: visible;
  }
  #wires path { fill: none; stroke: #4a4a4a; stroke-width: 1.6px; stroke-dasharray: 6 5; }
  #wires circle { fill: #ffffff; stroke: #4a4a4a; stroke-width: 1.4px; }
</style>
</head>
<body>
  <div id="panel">
    <svg id="wires"></svg>
    <div id="canvas"></div>
  </div>
  <script src="drawflow.min.js"></script>
  <script>
  (function () {
    "use strict";

    // ---- raw Streamlit component protocol (no streamlit-component-lib) ----
    function send(type, extra) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
    }
    function setValue(value) {
      send("streamlit:setComponentValue", { value: value, dataType: "json" });
    }
    function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

    var SVGNS = "http://www.w3.org/2000/svg";
    var FIXED_HEIGHT = 520;
    var editor = null;
    var dfToNode = {};        // drawflow int id -> our node object
    var edgeList = [];        // [{a: srcIntId, b: tgtIntId, op, ip}] for our own wire renderer
    var lastSig = null;       // graph currently drawn
    var builtSig = null;      // graph a build() has completed for
    var panelRO = null;       // live ResizeObserver on #panel
    var settleUntil = 0;      // rAF wire-redraw deadline after a build

    function panel() { return document.getElementById("panel"); }
    function sized() {
      var p = panel();
      return p && p.clientWidth > 40 && p.clientHeight > 40;
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    // content only -- the styling class lives on the .drawflow-node element.
    // Every port row carries an anchor <i class="dot" id="a-in|out-<intId>-<k>">
    // sitting on the card edge; drawWires() connects lines to those.
    function nodeContent(n, intId) {
      var badge = n.catalogue_id ? '<div class="twn-badge">DB</div>' : "";
      var ins = (n.inputs || []).map(function (p, k) {
        return '<div class="twn-port"><i class="dot" id="a-in-' + intId + '-' + (k + 1) +
               '"></i><span>' + esc(p) + "</span></div>";
      }).join("");
      var outs = (n.outputs || []).map(function (p, k) {
        return '<div class="twn-port"><i class="dot" id="a-out-' + intId + '-' + (k + 1) +
               '"></i><span>' + esc(p) + "</span></div>";
      }).join("");
      var body = (ins || outs)
        ? '<div class="twn-body"><div class="twn-col in">' + ins +
          '</div><div class="twn-col out">' + outs + "</div></div>"
        : "";
      return badge + '<div class="twn-title">' + esc(n.label || n.id) + "</div>" + body;
    }

    // longest-path rank per node id
    function ranks(nodes, edges) {
      var out = {}, adj = {}, indeg = {};
      nodes.forEach(function (n) { adj[n.id] = []; indeg[n.id] = 0; });
      edges.forEach(function (e) {
        if (adj[e.source] && (e.target in indeg)) { adj[e.source].push(e.target); indeg[e.target]++; }
      });
      var q = nodes.filter(function (n) { return indeg[n.id] === 0; }).map(function (n) { return n.id; });
      q.forEach(function (id) { out[id] = 0; });
      var guard = 0;
      while (q.length && guard++ < 10000) {
        var id = q.shift();
        adj[id].forEach(function (t) {
          out[t] = Math.max(out[t] == null ? 0 : out[t], out[id] + 1);
          if (--indeg[t] === 0) q.push(t);
        });
      }
      nodes.forEach(function (n) { if (out[n.id] == null) out[n.id] = 0; });
      return out;
    }

    // --- our own wire renderer (screen space) --------------------------------
    // Each wire connects the OUTPUT dot of the source port to the INPUT dot of
    // the target port (the <i class="dot" id="a-out|in-..."> anchors rendered
    // inside the card). Falls back to the node edge if an anchor is missing.
    // Recomputed on every pan / zoom / resize.
    function anchorAt(id, intId, side) {
      var el = document.getElementById(id);
      if (el) {
        var r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
      var node = document.getElementById("node-" + intId);
      if (!node) return null;
      var nr = node.getBoundingClientRect();
      return { x: side === "out" ? nr.right : nr.left, y: nr.top + nr.height / 2 };
    }

    function drawWires() {
      var svg = document.getElementById("wires");
      if (!svg) return;
      var p = panel();
      if (p) {
        svg.setAttribute("width", p.clientWidth);
        svg.setAttribute("height", p.clientHeight);
        svg.setAttribute("viewBox", "0 0 " + p.clientWidth + " " + p.clientHeight);
      }
      var wr = svg.getBoundingClientRect();
      var parts = [];
      edgeList.forEach(function (e) {
        var s = anchorAt("a-out-" + e.a + "-" + e.op, e.a, "out");
        var t = anchorAt("a-in-" + e.b + "-" + e.ip, e.b, "in");
        if (!s || !t) return;
        var x1 = s.x - wr.left, y1 = s.y - wr.top;
        var x2 = t.x - wr.left, y2 = t.y - wr.top;
        var dx = Math.max(30, Math.abs(x2 - x1) * 0.5);
        parts.push(
          '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ' ' +
          (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/>'
        );
      });
      svg.innerHTML = parts.join("");
    }

    function settleTick() {
      drawWires();
      if (Date.now() < settleUntil) requestAnimationFrame(settleTick);
    }

    function fitToView(byRank, COLW, ROWH) {
      try {
        var ranksN = Object.keys(byRank).length || 1;
        var maxCol = Math.max.apply(null, Object.keys(byRank).map(function (r) {
          return byRank[r].length;
        }).concat([1]));
        var gw = 160 + ranksN * COLW, gh = 160 + maxCol * ROWH;
        var p = panel();
        var cw = (p && p.clientWidth) || 800, ch = (p && p.clientHeight) || FIXED_HEIGHT;
        var z = Math.max(0.35, Math.min(0.85, Math.min(cw / gw, ch / gh)));
        var cx = 24, cy = 24;
        // Apply the pan/zoom transform directly -- Drawflow's zoom_refresh()
        // rescales canvas_x/y by zoom_last_value, which mangles a hand-set pan.
        editor.zoom = z;
        editor.zoom_last_value = z;
        editor.canvas_x = cx;
        editor.canvas_y = cy;
        editor.precanvas.style.transform =
          "translate(" + (cx / z) + "px, " + (cy / z) + "px) scale(" + z + ")";
      } catch (e) { /* leave default view */ }
      drawWires();
    }

    function build(args) {
      var wf = args.workflow || {};
      var nodes = wf.nodes || [];
      var edges = wf.edges || [];
      var suggested = args.suggested || [];

      var host = document.getElementById("canvas");
      host.innerHTML = "";
      editor = new Drawflow(host);
      editor.reroute = false;
      editor.zoom_value = 0.04;   // wheel-zoom step (default 0.1 -> too fast)
      editor.zoom_min = 0.3;
      editor.zoom_max = 1.8;
      editor.start();
      dfToNode = {};
      edgeList = [];

      var rk = ranks(nodes, edges);
      var byRank = {};
      nodes.forEach(function (n) { (byRank[rk[n.id]] = byRank[rk[n.id]] || []).push(n); });

      var COLW = 260, ROWH = 140;

      // --- assemble the Drawflow import object -------------------------------
      // import() runs load() -> addNodeImport for all, then
      // updateConnectionNodes("node-"+id) for every node in one pass. Far more
      // reliable than imperative addNode/addConnection + manual refresh.
      var data = { drawflow: { Home: { data: {} } } };
      var store = data.drawflow.Home.data;
      var idMap = {};   // our node id -> integer drawflow id
      var next = 1;

      function ports(prefix, count) {
        var m = {};
        for (var k = 1; k <= Math.max(1, count); k++) m[prefix + "_" + k] = { connections: [] };
        return m;
      }

      Object.keys(byRank).forEach(function (r) {
        var col = byRank[r];
        col.forEach(function (n, i) {
          var intId = next++;
          idMap[n.id] = intId;
          dfToNode[intId] = n;
          var isSug = !!n.catalogue_id && suggested.indexOf(n.catalogue_id) !== -1;
          store[intId] = {
            id: intId,
            name: n.id,
            data: {},
            class: "t-" + (n.type || "process") + (isSug ? " is-suggested" : ""),
            html: nodeContent(n, intId),
            typenode: false,
            pos_x: 40 + Number(r) * COLW,
            pos_y: 40 + (i - (col.length - 1) / 2) * ROWH + 240,
            inputs: ports("input", (n.inputs || []).length),
            outputs: ports("output", (n.outputs || []).length),
          };
        });
      });

      var wired = 0;
      edges.forEach(function (e) {
        var a = idMap[e.source], b = idMap[e.target];
        if (a == null || b == null || !store[a] || !store[b]) return;
        var na = dfToNode[a], nb = dfToNode[b];
        var outN = Object.keys(store[a].outputs).length;
        var inN = Object.keys(store[b].inputs).length;
        var op = Math.min(Math.max(e.source_port || 0, 0), outN - 1) + 1;
        var ip = Math.min(Math.max(e.target_port || 0, 0), inN - 1) + 1;
        store[a].outputs["output_" + op].connections.push({ node: String(b), output: "input_" + ip });
        store[b].inputs["input_" + ip].connections.push({ node: String(a), input: "output_" + op });
        edgeList.push({ a: a, b: b, op: op, ip: ip });
        wired++;
      });
      if (edges.length && wired === 0) console.warn("workflow: no connections wired");

      editor.import(data);

      fitToView(byRank, COLW, ROWH);

      editor.editor_mode = "fixed";   // read-only: no drag, no wiring (selection still fires)
      editor.on("nodeSelected", function (dfId) {
        var n = dfToNode[dfId] || dfToNode[parseInt(dfId, 10)];
        if (!n) return;
        setValue({ node: n.id, catalogue_id: n.catalogue_id || null, ts: Date.now() });
      });
      // redraw our wires whenever Drawflow pans or zooms
      editor.on("translate", drawWires);
      editor.on("zoom", drawWires);

      // keep wires glued through later layout changes (tab shown, resize)
      if (panelRO) { panelRO.disconnect(); }
      panelRO = new ResizeObserver(function () { drawWires(); });
      panelRO.observe(panel());

      // and follow the layout as it settles for ~1.2s after the build
      settleUntil = Date.now() + 1200;
      requestAnimationFrame(settleTick);

      builtSig = lastSig;
    }

    function schedule(args) {
      if (sized()) { build(args); return; }
      // panel not laid out yet (hidden tab / iframe not sized) -- wait for it
      var done = false;
      function run() {
        if (done || builtSig === lastSig) return;
        if (!sized()) return;
        done = true;
        if (ro) ro.disconnect();
        build(args);
      }
      var ro = new ResizeObserver(run);
      ro.observe(panel());
      requestAnimationFrame(run);
      setTimeout(run, 100);
      setTimeout(run, 400);
      setTimeout(run, 1000);
    }

    function sig(args) {
      try {
        var wf = args.workflow || {};
        return JSON.stringify([(wf.nodes || []).map(function (n) { return n.id; }),
                               (wf.edges || []).length, args.suggested || []]);
      } catch (e) { return Math.random().toString(); }
    }

    window.addEventListener("message", function (event) {
      var d = event.data || {};
      if (d.type !== "streamlit:render") return;
      var args = d.args || {};
      setHeight(FIXED_HEIGHT);
      var s = sig(args);
      if (s === builtSig) {  // same graph -> just re-settle the wires
        settleUntil = Date.now() + 600;
        requestAnimationFrame(settleTick);
        return;
      }
      lastSig = s;
      try { schedule(args); } catch (err) { console.error("workflow build failed", err); }
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    setHeight(FIXED_HEIGHT);
  })();
  </script>
</body>
</html>
